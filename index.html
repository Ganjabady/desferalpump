<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دستیار درخواست پمپ | انجمن تالاسمی استان هرمزگان</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
  
  :root {
    --primary: #6366f1;
    --primary-light: #818cf8;
    --accent: #ec4899;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --bg-dark: #0a0a1a;
    --bg-card: rgba(255, 255, 255, 0.06);
    --bg-chat: rgba(15, 15, 30, 0.7);
    --text: #fffffe;
    --text-dim: #a7a9be;
    --border: rgba(255, 255, 255, 0.1);
    --user-bubble: linear-gradient(135deg, #6366f1, #8b5cf6);
    --bot-bubble: rgba(255, 255, 255, 0.08);
  }
  
  body {
    min-height: 100vh;
    background: var(--bg-dark);
    color: var(--text);
    overflow: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  
  .bg-gradient {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 60%);
    z-index: 0;
  }
  
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
  }
  
  .chat-container {
    position: relative;
    z-index: 1;
    max-width: 500px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg-chat);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  
  .chat-header {
    padding: 14px 16px;
    background: rgba(10, 10, 26, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .bot-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    position: relative;
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    flex-shrink: 0;
  }
  .bot-avatar::after {
    content: '';
    position: absolute;
    bottom: 2px; left: 2px;
    width: 10px; height: 10px;
    background: var(--success);
    border-radius: 50%;
    border: 2px solid var(--bg-dark);
    box-shadow: 0 0 8px var(--success);
  }
  .bot-info { flex: 1; min-width: 0; }
  .bot-info h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bot-info p {
    font-size: 10px;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .header-actions {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-size: 13px;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.1); }
  .icon-btn:active { transform: scale(0.95); }
  
  .chat-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    padding-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
  }
  
  .message {
    display: flex;
    gap: 8px;
    max-width: 90%;
    animation: messageIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes messageIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user {
    align-self: flex-start;
    flex-direction: row;
  }
  .message.bot {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    margin-top: 2px;
  }
  .message.user .msg-avatar {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
  }
  .message.bot .msg-avatar {
    background: linear-gradient(135deg, var(--primary), var(--accent));
  }
  .msg-content { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .msg-bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 13px;
    line-height: 1.7;
    word-wrap: break-word;
    word-break: break-word;
  }
  .message.user .msg-bubble {
    background: var(--user-bubble);
    color: white;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }
  .message.bot .msg-bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg-bubble.error {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }
  .msg-time {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 3px;
    padding: 0 4px;
  }
  .message.user .msg-time { text-align: right; }
  .message.bot .msg-time { text-align: left; }
  
  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 18px;
    border-top-left-radius: 4px;
    width: fit-content;
    align-self: flex-end;
  }
  .typing span {
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typing 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
    animation: messageIn 0.4s;
  }
  .quick-reply {
    padding: 8px 13px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 18px;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 5px;
    -webkit-tap-highlight-color: transparent;
  }
  .quick-reply:hover {
    background: rgba(99, 102, 241, 0.2);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
  }
  .quick-reply:active {
    transform: scale(0.95);
  }
  .quick-reply.primary {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }
  
  .input-area {
    background: rgba(10, 10, 26, 0.85);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-wrap {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px;
  }
  .input-field {
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 4px 4px 4px 12px;
    transition: all 0.3s;
    flex: 1;
  }
  .input-field:focus-within {
    border-color: var(--primary-light);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  .text-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 8px 0;
    min-width: 0;
  }
  .text-input::placeholder { color: var(--text-dim); }
  .text-input.ltr { direction: ltr; text-align: left; }
  .send-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-size: 14px;
    flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
  }
  .send-btn:active:not(:disabled) {
    transform: scale(0.95);
  }
  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  
  .summary-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    margin-top: 6px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 4px;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
    font-size: 12px;
    gap: 8px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .label { color: var(--text-dim); flex-shrink: 0; }
  .summary-row .value { font-weight: 500; text-align: left; word-break: break-word; }
  
  .success-screen {
    text-align: center;
    padding: 20px 12px;
    animation: messageIn 0.5s;
  }
  .success-icon {
    width: 70px; height: 70px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--success), #059669);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    animation: pop 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
  }
  @keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .success-title {
    font-size: 17px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #fff, #a7a9be);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .success-desc {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.8;
    margin-bottom: 16px;
  }
  
  .date-sep {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    padding: 6px 0;
    position: relative;
  }
  .date-sep::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    height: 1px;
    background: var(--border);
    z-index: -1;
  }
  .date-sep span {
    background: var(--bg-chat);
    padding: 2px 10px;
  }
  
  .notice-box {
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.25);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.7;
    color: #fcd34d;
    margin-top: 6px;
  }
  
  .sending-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 14px;
    font-size: 12px;
    color: var(--primary-light);
    margin-top: 6px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(99, 102, 241, 0.3);
    border-top-color: var(--primary-light);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  /* Developer Info Modal */
  .dev-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.3s;
  }
  .dev-modal.active {
    display: flex;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .dev-modal-content {
    background: rgba(15, 15, 30, 0.95);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    max-width: 320px;
    width: 90%;
    text-align: center;
    animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .dev-modal-icon {
    width: 60px; height: 60px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .dev-modal-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .dev-modal-name {
    font-size: 14px;
    color: var(--primary-light);
    margin-bottom: 16px;
  }
  .dev-modal-links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .dev-modal-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    transition: all 0.3s;
  }
  .dev-modal-link:hover {
    background: rgba(99, 102, 241, 0.2);
    transform: translateY(-2px);
  }
  .dev-modal-close {
    padding: 10px 24px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    transition: all 0.3s;
  }
  .dev-modal-close:hover {
    background: rgba(255,255,255,0.1);

  @media (max-width: 500px) {
    .chat-container { max-width: 100%; border: none; }
    .message { max-width: 92%; }
    .bot-info h3 { font-size: 12px; }
    .chat-header { padding: 12px 14px; }
    .chat-area { padding: 14px; }
    .input-wrap { padding: 10px; }
    .msg-bubble { font-size: 12.5px; }
  }
  
  @media (max-height: 600px) {
    .chat-header { padding: 10px 14px; }
    .bot-avatar { width: 38px; height: 38px; font-size: 18px; }
    .chat-area { gap: 10px; }
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="grid-bg"></div>

<div class="chat-container">
  <div class="chat-header">
    <div class="bot-avatar">💉</div>
    <div class="bot-info">
      <h3>دستیار درخواست پمپ دسفرال</h3>

<script>
const WORKER_API_URL = 'https://pump-registration-api.ho3ein1ted8647.workers.dev/api/requests'; // نمونه: https://pump-registration-api.example.workers.dev/api/requests

const chatArea = document.getElementById('chatArea');
const inputArea = document.getElementById('inputArea');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const devModal = document.getElementById('devModal');

const data = {};
let currentQuestionIndex = 0;
let flow = [];

function openDevModal() {
  devModal.classList.add('active');
}

function closeDevModal() {
  devModal.classList.remove('active');
}

devModal.addEventListener('click', (e) => {
  if (e.target === devModal) closeDevModal();
});

function validateNationalId(code) {
  code = String(code).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                      .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  
  if (!/^\d{10}$/.test(code)) return { valid: false, msg: 'کد ملی باید دقیقاً ۱۰ رقم باشد.' };
  if (/^(\d)\1{9}$/.test(code)) return { valid: false, msg: 'کد ملی نامعتبر است.' };
  
  const check = parseInt(code[9]);
  let sum = 0;
  for (let i = 0; i < 9; i++) {
    sum += parseInt(code[i]) * (10 - i);
  }
  const remainder = sum % 11;
  const expected = remainder < 2 ? remainder : (11 - remainder);
  
  if (check !== expected) {
    return { valid: false, msg: 'کد ملی نامعتبر است. لطفاً دوباره بررسی کنید.' };
  }
  return { valid: true };
}

function validatePhone(phone) {
  phone = String(phone).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                       .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  
  if (!/^\d{11}$/.test(phone)) return { valid: false, msg: 'شماره باید دقیقاً ۱۱ رقم باشد.' };
  if (!phone.startsWith('09')) return { valid: false, msg: 'شماره باید با 09 شروع شود.' };
  
  const prefix = phone.substring(0, 4);
  const validPrefixes = ['0910','0911','0912','0913','0914','0915','0916','0917','0918','0919',
                         '0920','0921','0922','0923','0930','0933','0935','0936','0937','0938','0939',
                         '0901','0902','0903','0904','0905','0941','0990','0991','0992','0993','0994'];
  if (!validPrefixes.includes(prefix)) {
    return { valid: false, msg: 'پیش‌شماره موبایل معتبر نیست.' };
  }
  return { valid: true };
}

function buildFlow() {
  flow = [
    {
      key: 'fullName',
      question: 'لطفاً **نام و نام خانوادگی** خود را وارد کنید:',
      type: 'text',
      placeholder: 'مثلاً: علی محمدی',
      validate: v => v.trim().length >= 3,
      errorMsg: 'لطفاً نام کامل خود را وارد کنید (حداقل ۳ کاراکتر).'
    },
    {
      key: 'nationalId',
      question: '🆔 **کد ملی ۱۰ رقمی** خود را وارد کنید:',
      type: 'text',
      placeholder: 'مثلاً: 0012345678',
      ltr: true,
      validate: v => validateNationalId(v).valid,
      getError: v => validateNationalId(v).msg
    },
    {
      key: 'insurance',
      question: '🏥 **نوع بیمه** شما کدام است؟',

function getTime() {
  const now = new Date();
  return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
}

function scrollToBottom() {
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

function addMessage(text, sender, isHTML = false, extraClass = '') {
  const msg = document.createElement('div');
  msg.className = `message ${sender}`;
  
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = sender === 'user' ? '👤' : '💉';
  
  const content = document.createElement('div');
  content.className = 'msg-content';
  
  const bubble = document.createElement('div');
  bubble.className = `msg-bubble ${extraClass}`;
  if (isHTML) bubble.innerHTML = text;
  else bubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = getTime();
  
  content.appendChild(bubble);
  content.appendChild(time);
  
  msg.appendChild(avatar);
  msg.appendChild(content);
  
  chatArea.appendChild(msg);
  scrollToBottom();
  return msg;
}

function showTyping() {
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.id = 'typingIndicator';
  typing.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(typing);

}

function hideTyping() {

function showQuickReplies(options, callback) {
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';
  wrap.id = 'quickReplies';
  
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.innerHTML = `<span>${opt.icon}</span><span>${opt.value}</span>`;
    btn.onclick = () => {
      wrap.remove();
      callback(opt.value);
    };
    wrap.appendChild(btn);
  });
  
  chatArea.appendChild(wrap);
  scrollToBottom();
}

function showInputMode(placeholder, ltr = false) {
  inputArea.style.display = 'block';
  textInput.placeholder = placeholder || 'پاسخ خود را بنویسید...';
  textInput.value = '';
  textInput.classList.toggle('ltr', ltr);
  textInput.focus();
  sendBtn.disabled = true;
}

function hideInputMode() {
  inputArea.style.display = 'none';
}

function getNextQuestion(currentIdx) {
  const allQuestions = flow;
  for (let i = currentIdx + 1; i < allQuestions.length; i++) {
    const q = allQuestions[i];
    if (!q.condition || q.condition()) return { question: q, index: i };
  }
  return null;
}

function askQuestion(index) {
  const next = getNextQuestion(index - 1);
  if (!next) {
    showSummary();
    return;
  }
  
  currentQuestionIndex = next.index;
  const q = next.question;
  
  showTyping();
  
  setTimeout(() => {
    hideTyping();
    addMessage(q.question, 'bot');
    
    if (q.type === 'options') {
      showQuickReplies(q.options, (value) => {
        data[q.key] = value;
        addMessage(value, 'user');
        
        if (q.next) {
          const nextKey = q.next(value);
          if (nextKey) {
            const nextQ = flow.find(x => x.key === nextKey);
            if (nextQ) {
              setTimeout(() => {
                const idx = flow.indexOf(nextQ);
                askQuestion(idx);
              }, 500);
              return;
            }
          }
        }
        
        setTimeout(() => askQuestion(currentQuestionIndex + 1), 500);
      });
      hideInputMode();
    } else {
      showInputMode(q.placeholder, q.ltr);
    }
  }, 800 + Math.random() * 400);
}

function handleUserInput() {
  const value = textInput.value.trim();
  if (!value) return;
  
  const q = flow[currentQuestionIndex];
  
  if (q.validate && !q.validate(value)) {
    addMessage(value, 'user');
    hideInputMode();
    showTyping();
    setTimeout(() => {
      hideTyping();
      const errorMsg = q.getError ? q.getError(value) : (q.errorMsg || 'پاسخ نامعتبر است. لطفاً دوباره وارد کنید:');
      addMessage('⚠️ ' + errorMsg, 'bot', false, 'error');
      showInputMode(q.placeholder, q.ltr);
    }, 600);
    return;
  }
  
  data[q.key] = value;
  addMessage(value, 'user');
  hideInputMode();
  
  setTimeout(() => askQuestion(currentQuestionIndex + 1), 500);
}

async function submitToGoogleSheet(sendingDiv) {
  const payload = {
    fullName: data.fullName || '',
    nationalId: data.nationalId || '',
    insurance: data._finalInsurance || '',
    pumpStatus: data.pumpStatus || '',
    lastYear: data.lastYear || '',
    pumpModel: data._finalPumpModel || '',
    city: data._finalCity || data.city || '',
    treatmentCenter: data._finalTreatmentCenter || data.treatmentCenter || '',
    treatmentCenterOther: data.treatmentCenter === 'سایر (تایپ دستی)',
    phone: data.phone || '',
    phone2: data.phone2 || '',
    source: 'چت‌بات'
  };

  if (!WORKER_API_URL || WORKER_API_URL === 'PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE') {
    showFailure(sendingDiv, 'آدرس Cloudflare Worker هنوز در فایل سایت وارد نشده است. ابتدا Worker را راه‌اندازی و آدرس آن را در کد قرار دهید.');
    return;
  }

  try {
    const response = await fetch(WORKER_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    let result = {};
    try { result = await response.json(); } catch (_) {}
    if (result.duplicate) {
      showDuplicate(sendingDiv, result);
      return;
    }
    if (!response.ok || !result.success) {
      throw new Error(result.error || 'ثبت درخواست انجام نشد. لطفاً دوباره تلاش کنید.');
    }
    showSuccess(sendingDiv);
  } catch (err) {
    console.error('خطا در ثبت درخواست:', err);
    showFailure(sendingDiv, err.message || 'ارتباط با سامانه برقرار نشد. اتصال اینترنت را بررسی و دوباره تلاش کنید.');
  }
}

function showFailure(sendingDiv, message) {
  if (sendingDiv) sendingDiv.remove();
  const html = `
    <div class="notice-box" style="border-color:#d9534f; color:#a12622; margin-top:8px">
      <strong>ثبت درخواست انجام نشد.</strong><br>${String(message).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
    </div>
    <p>اطلاعات واردشده در این مرحله ثبت نشده است. لطفاً پس از رفع مشکل دوباره تلاش کنید.</p>
  `;
  addMessage(html, 'bot', true);
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';
  wrap.style.justifyContent = 'center';
  const btn = document.createElement('button');
  btn.className = 'quick-reply primary';
  btn.innerHTML = '🔄 شروع مجدد';
  btn.onclick = () => location.reload();
  wrap.appendChild(btn);
  chatArea.appendChild(wrap);
  scrollToBottom();
}

function showDuplicate(sendingDiv, result) {
  if (sendingDiv) sendingDiv.remove();
  const name = String(result.fullName || data.fullName || 'همراه گرامی').trim();
  const status = String(result.status || 'جدید').trim();
  const statusText = status === 'جدید'
    ? 'اطلاعات شما پیش‌تر در سامانه ثبت شده است و درخواست شما در انتظار بررسی قرار دارد.'
    : `وضعیت فعلی درخواست شما «${status}» است.`;
  const safe = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const html = `
    <div class="success-screen">
      <div class="success-icon">✓</div>
      <h3 class="success-title">اطلاعات شما قبلاً ثبت شده است</h3>
      <p class="success-desc">
        همراه گرامی <strong>${safe(name)}</strong>،<br>
        مشخصات شما پیش‌تر در سامانه انجمن حمایت از بیماران تالاسمی استان هرمزگان ثبت شده است.<br>
        ${safe(statusText)}<br><br>
        اگر درباره اطلاعات یا وضعیت درخواست خود پرسشی دارید، لطفاً از طریق پیام‌رسان ایتا یا واتساپ با شماره <strong dir="ltr">09170923885</strong> تماس بگیرید تا همکاران انجمن راهنمایی و پیگیری لازم را انجام دهند.
      </p>
      <div class="notice-box">برای جلوگیری از ثبت درخواست تکراری، فرم جدیدی ایجاد نشد.</div>
    </div>
  `;
  addMessage(html, 'bot', true);
  scrollToBottom();
}

  sendBtn.disabled = !textInput.value.trim();

textInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !sendBtn.disabled) {
    handleUserInput();
  }
});

sendBtn.addEventListener('click', handleUserInput);

setTimeout(() => {
  addMessage('سلام 👋 خوش آمدید!\nمن **دستیار درخواست پمپ دسفرال** اعضای انجمن تالاسمی استان هرمزگان هستم 🌹', 'bot');
  
  setTimeout(() => {
    addMessage('برای ثبت درخواست دریافت پمپ دسفرال، چند سؤال از شما می‌پرسم.\nاطلاعات شما کاملاً محرمانه خواهد ماند 🔒', 'bot');
    
    setTimeout(() => {
      flow = buildFlow();
      askQuestion(0);
    }, 800);
  }, 1000);
}, 500);
</script>
